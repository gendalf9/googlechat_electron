<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google Chat Desktop</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #fff;
      }

      #chat-frame {
        width: 100vw;
        height: 100vh;
        border: none;
        display: block;
      }

      /* 로딩 화면 */
      .loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #f8f9fa;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        z-index: 1000;
      }

      .loading.hidden {
        display: none;
      }

      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #e3e3e3;
        border-top: 4px solid #4285f4;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 16px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .loading-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
        color: #5f6368;
      }
    </style>
  </head>
  <body>
    <!-- 로딩 화면 -->
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div class="loading-text">Google Chat를 불러오는 중...</div>
    </div>

    <!-- Google Chat 웹뷰 -->
    <iframe
      id="chat-frame"
      src="https://chat.google.com"
      sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-top-navigation"
      onload="hideLoading()"
    >
    </iframe>

    <script>
      function hideLoading() {
        const loading = document.getElementById('loading');
        if (loading) {
          loading.classList.add('hidden');
        }
      }

      // Google Chat 다운로드 핸들링
      document.addEventListener('DOMContentLoaded', () => {
        const iframe = document.getElementById('chat-frame');

        iframe.addEventListener('load', () => {
          const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;

          // 다운로드 버튼 감지
          const observer = new MutationObserver(mutations => {
            mutations.forEach(mutation => {
              if (mutation.type === 'childList') {
                const downloadLinks = iframeDoc.querySelectorAll('a[href*="get_attachment_url"]');
                downloadLinks.forEach(link => {
                  if (!link.dataset.tauriHandled) {
                    link.dataset.tauriHandled = 'true';
                    link.addEventListener('click', e => {
                      e.preventDefault();
                      const url = link.href;
                      const fileName = link.getAttribute('download') || 'chat_attachment';
                      // Tauri API를 통해 다운로드 처리
                      if (window.__TAURI__) {
                        window.__TAURI__.shell.open(url);
                      }
                    });
                  }
                });
              }
            });
          });

          observer.observe(iframeDoc.body, {
            childList: true,
            subtree: true
          });
        });
      });

      // 키보드 단축키 처리
      document.addEventListener('keydown', e => {
        // Cmd/Ctrl + R: 새로고침
        if ((e.metaKey || e.ctrlKey) && e.key === 'r') {
          e.preventDefault();
          const iframe = document.getElementById('chat-frame');
          iframe.src = iframe.src;
          return;
        }

        // Cmd/Ctrl + Shift + R: 강제 새로고침
        if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key === 'R') {
          e.preventDefault();
          const iframe = document.getElementById('chat-frame');
          iframe.src = 'https://chat.google.com?' + Date.now();
          return;
        }

        // F12: 개발자 도구 (개발 모드에서만)
        if (e.key === 'F12' && window.location.hostname === 'localhost') {
          e.preventDefault();
          if (window.__TAURI__) {
            window.__TAURI__.window.getCurrent().toggleDevtools();
          }
          return;
        }
      });
    </script>
  </body>
</html>
